# 工作流名称：Windows 便携版极速打包（云端白嫖版）
name: Build Windows Portable

# 触发条件：允许在 GitHub 网页上手动点击按钮运行
on:
  workflow_dispatch:

jobs:
  build:
    # ⚡ 优化 1：不要用 windows-latest！
    # 因为 GitHub 把 latest 指向了 Windows Server 2025 + VS2026，VS2026 的编译器太新，
    # 导致旧的 Flutter 插件（permission_handler）报 C2338 错误，必须锁死在 2022 版本。
    runs-on: windows-2022
    
    # ⚡ 优化 2：防呆保护
    # 设置 20 分钟超时，万一网络抽风卡死，自动终止，不浪费免费额度。
    timeout-minutes: 20

    steps:
      # --- 第一步：拉取代码 ---
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: rust-local-force # 指定拉取 rust-local-force 分支
          fetch-depth: 1 # 只拉取最近一次 commit，加快下载速度

      # --- 第二步：安装并缓存 Flutter（核心提速） ---
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5' # 锁死版本，防止未来更新导致不兼容
          channel: 'stable'
          cache: true # ⚡ 开启缓存！下次重跑，直接复用这 1.79G 的 Flutter SDK，省去漫长的下载

      # --- 第三步：安装并缓存 Rust（核心提速） ---
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc # 脚本强制要求 MSVC 工具链

      # ⚡ 专门针对 Rust 的缓存，直接复用之前编译好的依赖包，节省 1~2 分钟
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'kugou_api_server/rust -> target'

      # --- 第四步：拉取 Flutter 依赖 ---
      - name: Install Flutter dependencies
        run: flutter pub get

      # --- 第五步：补齐项目缺失的 Windows 外壳 ---
      # ⭐ 关键救命步骤：原仓库作者没把 windows 文件夹传上来，必须自己生成
      - name: Generate Windows platform folder
        run: flutter create . --platforms=windows

      # --- 第六步：配置 Git 身份 ---
      # 你的 windows.ps1 脚本里会运行 git status 检查代码，没有身份信息会报错退出
      - name: Configure Git for CI
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"

      # --- 第七步：执行真正的打包脚本 ---
      - name: Run Windows Build Script
        run: powershell -ExecutionPolicy Bypass -File .\scripts\tasks\windows.ps1 -NoPause
        # 脚本逻辑：编译Rust -> flutter build -> 复制DLL和运行库 -> 压缩ZIP

      # --- 第八步：捞取最终产物 ---
      - name: Upload Portable Zip
        uses: actions/upload-artifact@v4
        if: always() # 容错机制：无论前面是否报错，只要有 zip 文件就捞出来
        with:
          name: md3music-windows
          path: build/windows/*.zip
          if-no-files-found: warn
