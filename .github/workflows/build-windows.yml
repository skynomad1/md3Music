# 工作流名称，会显示在 GitHub Actions 页面的左侧
name: Build Windows Portable

# 触发条件：workflow_dispatch 表示允许在 GitHub 网页上手动点击按钮运行
on:
  workflow_dispatch: 

jobs:
  build:
    # 核心：向微软借用一台运行最新 Windows Server 的云端虚拟机
    runs-on: windows-latest 
    steps:
      # 第一步：把仓库里的代码拉取到虚拟机里
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 明确指定拉取我们需要打包的 rust-local-force 分支
          ref: rust-local-force 

      # 第二步：在云端安装 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # ⚠️ 锁定 3.47.5 版本（这是经过上次测试的稳定版，防止未来更新导致代码不兼容）
          flutter-version: '3.47.5'
          channel: 'stable'

      # 第三步：在云端安装 Rust 环境
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 必须指定 MSVC 工具链，因为 windows.ps1 脚本里强制要求 *-msvc
          targets: x86_64-pc-windows-msvc 

      # 第四步：拉取项目的 Flutter 依赖包
      - name: Install Flutter dependencies
        run: flutter pub get

      # 第五步（⭐ 关键救星）：让 Flutter 自动补全缺失的 windows 平台文件夹
      # 因为原仓库上传时可能忽略了 windows 文件夹，没它打包会报错"未配置Windows项目"
      - name: Generate Windows platform folder
        run: flutter create . --platforms=windows

      # 第六步：配置临时 Git 身份
      # windows.ps1 脚本内部会运行 git status 检测代码改动，没有身份信息会直接报错退出
      - name: Configure Git for CI
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"

      # 第七步：真正开始执行打包脚本
      # -NoPause 是为了防止脚本结束时傻等按键，导致云端一直卡住
      - name: Run Windows Build Script
        run: powershell -ExecutionPolicy Bypass -File .\scripts\tasks\windows.ps1 -NoPause

      # 第八步：把打包好的 zip 压缩包捞出来放到网页上
      # if: always() 确保即使前面步骤报错，只要有 zip 文件也会捞出来（方便排查）
      - name: Upload Portable Zip
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: md3music-windows
          # 对应脚本执行完后生成的 build\windows\md3music-windows-版本号.zip
          path: build/windows/*.zip 
          if-no-files-found: warn
